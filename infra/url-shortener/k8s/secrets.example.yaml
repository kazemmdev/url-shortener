# Shape of the secret this stack expects. Don't apply this file directly —
# run ./create-secrets.sh, which generates a real secrets.yaml (gitignored)
# with a proper password.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "CHANGE_ME_Str0ng!Passw0rd"
  ConnectionStrings__Default: "Server=sqlserver,1433;Database=UrlShortener;User Id=sa;Password=CHANGE_ME_Str0ng!Passw0rd;TrustServerCertificate=True"
